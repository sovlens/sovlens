[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovlens"
version = "0.3.1"
description = "Read-only readiness scanner for the AWS European Sovereign Cloud"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovlens", email = "hello@sovlens.dev" }]
keywords = ["aws", "european sovereign cloud", "aws-eusc", "eusc-de-east-1", "migration", "sovereignty", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = ["boto3[crt]>=1.40"]

[project.urls]
Homepage = "https://sovlens.dev"
Source = "https://github.com/sovlens/sovlens"
Issues = "https://github.com/sovlens/sovlens/issues"
"ESC services list" = "https://sovlens.dev/esc-services"

[project.optional-dependencies]
dev = ["pytest", "moto[all]"]

[project.scripts]
sovlens = "sovlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sovlens = ["data/*.json"]
