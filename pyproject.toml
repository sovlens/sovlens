[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovlens"
version = "0.2.1"
description = "Read-only readiness scanner for the AWS European Sovereign Cloud"
requires-python = ">=3.10"
dependencies = ["boto3[crt]>=1.40"]

[project.optional-dependencies]
dev = ["pytest", "moto[all]"]

[project.scripts]
sovlens = "sovlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
